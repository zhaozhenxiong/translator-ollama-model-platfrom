[project]
name = "local-live-translator"
version = "0.1.0"
description = "Local real-time transcription with Ollama or CC Switch translation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=14,<17",
  "whisperlivekit[mlx-whisper]>=0.2.18",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
